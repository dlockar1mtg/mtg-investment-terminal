schema_version: "10.5R.1D.2.4C.2"
policy_name: historical_mtgjson_set_aliases

description: >
  Explicit mappings between governed historical sealed-product identities
  and MTGJSON set identities. Exact aliases correct known naming differences.
  Multi-set family routes remain unresolved until sealed-product records are
  inspected. No final release dates or eligibility decisions are assigned.

