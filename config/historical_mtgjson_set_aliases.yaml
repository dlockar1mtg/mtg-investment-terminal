set_family_reviews:
  - canonical_product_id: "MTG-CANON-TCGPLAYER-208523"
    canonical_product_name: >
      Mystery Booster - Booster Box [Retail Exclusive]
    candidate_set_codes:
      - "MB1"
    family_review_reason: >
      Retail sealed product belongs to the Mystery Booster family, but its
      product-level release date must be read from MTGJSON sealed products
      before the set date is accepted.

  - canonical_product_id: "MTG-CANON-TCGPLAYER-217533"
    canonical_product_name: >
      Mystery Booster - Booster Box [Convention Edition] (2019)
    candidate_set_codes:
      - "MB1"
      - "CMB1"
    family_review_reason: >
      Convention Edition 2019 may be represented by the parent Mystery
      Booster set or the 2019 playtest-card child set. Product-level sealed
      records must determine the correct relationship.

  - canonical_product_id: "MTG-CANON-TCGPLAYER-246935"
    canonical_product_name: >
      Mystery Booster - Booster Box [Convention Edition] (2021)
    candidate_set_codes:
      - "MB1"
      - "CMB2"
    family_review_reason: >
      Convention Edition 2021 may be represented by the parent Mystery
      Booster set or the 2021 playtest-card child set. Product-level sealed
      records must determine the correct relationship.

decision_controls:
  exact_aliases_are_set_routes_only: true
  set_family_reviews_remain_unresolved: true
  final_release_dates_assigned: false
  final_eligibility_assigned: false
  scoring_allowed: false
  universal_investable_allowed: false