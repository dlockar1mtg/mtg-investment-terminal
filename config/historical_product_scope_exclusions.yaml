schema_version: "10.5R.1D.2.4E.3"
policy_name: historical_product_scope_exclusions

description: >
  Product-specific exclusions from the historical premium MTG review
  population. These exclusions apply only to the explicitly listed products
  and must not be interpreted as a general language, region, or product-name
  filtering policy.

