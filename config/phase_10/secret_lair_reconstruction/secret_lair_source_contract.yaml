schema_version: "10.5R.3.1"
pipeline_name: "Secret Lair Multi-Source Reconstruction"

governance:
  production_registry_changed: false
  universal_database_changed: false
  final_eligibility_assigned: false
  scoring_enabled: false
  universal_investable_enabled: false
  raw_evidence_is_not_investment_approval: true

source_priority:
  identity:
    - wizards_official
    - tcgcsv
    - mtgjson
    - scryfall
    - existing_repository

  official_sale_information:
    - wizards_official
    - wizards_announcements

  marketplace_identity:
    - tcgcsv
    - mtgjson

  current_pricing:
    - tcgcsv

  historical_pricing:
    - tcgcsv_archive

  sealed_product_contents:
    - mtgjson
    - wizards_official
    - scryfall

sources:
  wizards_official:
    authority: official
    purpose:
      - official_drop_name
      - sale_start_date
      - sale_end_date
      - original_sale_price
      - foil_treatment
      - product_configuration
      - limited_or_print_to_demand
    automated_collection_policy: cached_pages_and_declared_public_pages
    required_for_final_identity: false

  wizards_announcements:
    authority: official
    purpose:
      - announcement_date
      - drop_description
      - edition_details
      - release_context
    automated_collection_policy: declared_public_pages
    required_for_final_identity: false

  tcgcsv:
    authority: marketplace_catalog
    purpose:
      - tcgplayer_product_id
      - category_id
      - group_id
      - marketplace_product_name
      - current_market_price
      - current_low_price
      - current_mid_price
      - current_high_price
      - price_subtype
    required_for_market_pricing: true

  tcgcsv_archive:
    authority: historical_market_archive
    history_start_date: "2024-02-08"
    purpose:
      - historical_market_price
      - historical_low_price
      - historical_mid_price
      - historical_high_price
      - historical_subtype_price
    required_for_historical_forecasting: true

  mtgjson:
    authority: structured_magic_dataset
    purpose:
      - sealed_product_uuid
      - sealed_product_name
      - sealed_category
      - sealed_subtype
      - release_date
      - sealed_contents
      - purchase_urls
      - external_identifiers
    required_for_final_identity: false

  scryfall:
    authority: card_printing_dataset
    purpose:
      - card_composition
      - printing_identity
      - set_code
      - collector_number
      - finish
    required_for_final_identity: false

classification:
  accepted_investment_product_types:
    - complete_drop
    - foil_drop
    - nonfoil_drop
    - rainbow_foil_drop
    - etched_foil_drop
    - commander_deck
    - countdown_kit
    - sealed_bundle

  review_required_product_types:
    - superdrop_bundle
    - convention_bundle
    - festival_in_a_box
    - accessory_bundle
    - ambiguous_sealed_product

  excluded_product_types:
    - individual_card
    - bonus_card
    - single_card_listing
    - opened_product
    - digital_product
    - accessory_only
    - empty_packaging

identity_rules:
  canonical_unit: purchasable_sealed_edition
  foil_and_nonfoil_are_separate_assets: true
  bundles_and_component_drops_are_separate_assets: true
  marketplace_card_listings_are_not_sealed_products: true
  exact_tcgplayer_product_id_preferred: true
  normalized_name_only_match_requires_review: true
  conflicting_official_and_marketplace_identity_requires_review: true

pricing_rules:
  market_price_preferred: true
  subtype_prices_preserved: true
  zero_prices_are_missing: true
  negative_prices_invalid: true
  duplicate_same_day_prices_require_resolution: true
  currency: USD
  minimum_history_days_for_forecast: 180
  preferred_history_days_for_forecast: 365

target_outputs:
  registry: secret_lair_registry.csv
  variants: secret_lair_product_variants.csv
  official_evidence: secret_lair_official_release_evidence.csv
  current_prices: secret_lair_current_prices.csv
  price_history: secret_lair_price_history.csv
  price_quality: secret_lair_price_quality.csv
  forecast_readiness: secret_lair_forecast_readiness.csv
  summary: secret_lair_reconstruction_summary.json