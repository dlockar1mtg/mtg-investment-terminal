name: MTG Marketplace Production

on:
  pull_request:
    paths:
      - ".github/workflows/mtg-marketplace-production.yml"
      - "requirements.txt"
      - "scripts/**"
      - "terminal2/market_sources/**"
      - "tests/test_daily_ebay_collection_entrypoint.py"
      - "tests/test_daily_tcgcsv_collection_entrypoint.py"
      - "tests/test_tcgcsv_group_id_reconciliation.py"
      - "tests/test_mtg_marketplace_production.py"
      - "tests/test_marketplace_quality_certification.py"
      - "tests/test_ebay_targeted_collection.py"
      - "tests/test_marketplace_decisioning.py"
      - "tests/test_mtg_hosted_uip_delivery.py"
      - "tests/test_mtg_live_uip_overlay.py"
      - "data/reference/product_map.csv"
      - "data/product_master/product_master_model_input.csv"

  workflow_dispatch:
    inputs:
      live_execution:
        description: "Run live eBay and TCGCSV source refresh"
        required: true
        default: false
        type: boolean
      ebay_batch_index:
        description: "Optional zero-based eBay batch index; leave blank to rotate automatically"
        required: false
        default: ""
        type: string
      ebay_batch_size:
        description: "Number of governed products in the eBay batch"
        required: false
        default: "25"
        type: string

  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: read

concurrency:
  group: mtg-marketplace-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marketplace-production:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      LIVE_EXECUTION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_execution == true) }}
      MTG_LIVE_EXECUTION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_execution == true) }}
      EBAY_LIMIT: "200"
      EBAY_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.ebay_batch_size || '25' }}
      EBAY_BATCH_INDEX: ${{ github.event_name == 'workflow_dispatch' && inputs.ebay_batch_index || '' }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - name: Checkout MTG repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9"
          python -m pip check
          python - <<'PY'
          import numpy
          import pandas
          import pytest
          import requests
          print("Dependency imports passed")
          print(f"pytest={pytest.__version__}")
          PY

      - name: Validate repository inputs and Linux imports
        shell: bash
        run: |
          test -f data/reference/product_map.csv
          test -f data/product_master/product_master_model_input.csv
          test -f scripts/build_mtg_governed_marketplace_universe.py
          test -f scripts/build_universal_mtg_history_foundation.py
          test -f scripts/build_universal_mtg_daily_history.py
          test -f scripts/select_mtg_marketplace_batch.py
          test -f scripts/run_mtg_marketplace_production.py
          test -f scripts/certify_mtg_marketplace_observations.py
          test -f scripts/run_certified_marketplace_decisioning.py
          test -f scripts/build_mtg_hosted_uip_delivery.py
          test -f scripts/apply_mtg_live_uip_overlay.py
          python -m compileall -q scripts terminal2
          python - <<'PY'
          from scripts.reconcile_tcgcsv_group_ids import reconcile
          from terminal2.market_sources.ebay_targeted_collection import select_target_products
          from terminal2.market_sources.marketplace_quality import certify_rows
          from terminal2.market_sources.marketplace_decisioning import build_decisions
          print("Marketplace source-production imports passed")
          PY

      - name: Validate live credentials
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        shell: bash
        run: |
          test -n "$EBAY_CLIENT_ID" || { echo "EBAY_CLIENT_ID secret is missing"; exit 1; }
          test -n "$EBAY_CLIENT_SECRET" || { echo "EBAY_CLIENT_SECRET secret is missing"; exit 1; }

      - name: Run marketplace source-production tests
        run: |
          python -m pytest \
            tests/test_daily_ebay_collection_entrypoint.py \
            tests/test_daily_tcgcsv_collection_entrypoint.py \
            tests/test_tcgcsv_group_id_reconciliation.py \
            tests/test_mtg_marketplace_production.py \
            tests/test_marketplace_quality_certification.py \
            tests/test_ebay_targeted_collection.py \
            tests/test_marketplace_decisioning.py \
            tests/test_mtg_hosted_uip_delivery.py \
            tests/test_mtg_live_uip_overlay.py \
            tests/test_mtg_governed_marketplace_universe.py \
            tests/test_mtg_marketplace_batch_selection.py \
            tests/test_universal_mtg_history_foundation.py \
            tests/test_universal_mtg_daily_history.py \
            -q

      - name: Build governed marketplace universe
        run: |
          python scripts/build_mtg_governed_marketplace_universe.py

      - name: Select deterministic marketplace batch
        shell: bash
        run: |
          EXTRA_BATCH_ARGS=""
          if [[ -n "$EBAY_BATCH_INDEX" ]]; then
            EXTRA_BATCH_ARGS="--batch-index $EBAY_BATCH_INDEX"
          fi
          python scripts/select_mtg_marketplace_batch.py             --universe data/operations/mtg_marketplace/governed_universe/governed_marketplace_product_map.csv             --output data/operations/mtg_marketplace/runtime/marketplace_batch_product_map.csv             --summary-output data/operations/mtg_marketplace/runtime/marketplace_batch_summary.json             --batch-size "$EBAY_BATCH_SIZE"             --run-number "${{ github.run_number }}"             $EXTRA_BATCH_ARGS

      - name: Validate marketplace batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "data/operations/mtg_marketplace/runtime/"
              "marketplace_batch_summary.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("status") != "PASS":
              raise SystemExit(f"Marketplace batch failed: {payload}")
          if payload.get("universe_ready_products") != 1141:
              raise SystemExit(
                  "Governed universe did not contain 1,141 ready products"
              )
          if payload.get("ebay_batch_products", 0) < 1:
              raise SystemExit("eBay batch is empty")
          if payload.get("tcgcsv_full_refresh_products") != 168:
              raise SystemExit(
                  "TCGCSV refresh did not retain all 168 eligible products"
              )
          print(json.dumps(payload, indent=2))
          PY

      - name: Run unified MTG marketplace source refresh
        shell: bash
        run: |
          LIVE_FLAG=""
          if [[ "$LIVE_EXECUTION" == "true" ]]; then
            LIVE_FLAG="--live"
          fi
          python scripts/run_mtg_marketplace_production.py \
            $LIVE_FLAG \
            --product-map data/operations/mtg_marketplace/runtime/marketplace_batch_product_map.csv \
            --model-input data/product_master/product_master_model_input.csv \
            --ebay-limit "$EBAY_LIMIT" \
            --output data/operations/mtg_marketplace/latest.json

      - name: Build universal MTG history foundation
        run: |
          python scripts/build_universal_mtg_history_foundation.py

      - name: Build distinct-date history and source verification
        run: |
          python scripts/build_universal_mtg_daily_history.py

      - name: Validate universal history backfill foundation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/operations/mtg_history_backfill/universal_mtg_history_backfill_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("status") != "PASS":
              raise SystemExit(f"History backfill foundation failed: {payload}")
          if payload.get("governed_products") != 1141:
              raise SystemExit("History verification did not retain 1,141 products")
          print(json.dumps(payload, indent=2))
          PY

      - name: Validate marketplace source refresh
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("data/operations/mtg_marketplace/latest.json")
          if not path.is_file():
              raise SystemExit("Marketplace summary was not created")
          payload = json.loads(path.read_text(encoding="utf-8"))
          live = os.getenv("LIVE_EXECUTION", "false").lower() == "true"
          expected = "PASS" if live else "DRY_RUN_PASS"
          if payload.get("status") != expected:
              raise SystemExit(
                  f"Unexpected marketplace status: {payload.get('status')} "
                  f"expected={expected}; reasons={payload.get('reason_codes')}"
              )
          if payload.get("deal_ranking_count", 0) < 1:
              raise SystemExit("No legacy deal rankings were produced")
          print(f"Marketplace source refresh validated: {expected}")
          PY

      - name: Certify marketplace observations
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python scripts/certify_mtg_marketplace_observations.py \
            --input data/operations/mtg_marketplace/normalized_marketplace_observations.csv \
            --output data/operations/mtg_marketplace/certified_marketplace_observations.csv \
            --summary-output data/operations/mtg_marketplace/marketplace_quality_certification.json

      - name: Validate marketplace certification
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/operations/mtg_marketplace/marketplace_quality_certification.json")
          if not path.is_file():
              raise SystemExit("Marketplace certification summary was not created")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("status") != "PASS" or payload.get("eligible_observation_count", 0) < 1:
              raise SystemExit(f"Marketplace certification failed: {payload}")
          print("Marketplace certification validated")
          PY

      - name: Build certified marketplace decisions
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python scripts/run_certified_marketplace_decisioning.py \
            --certified-observations data/operations/mtg_marketplace/certified_marketplace_observations.csv \
            --model-input data/product_master/product_master_model_input.csv \
            --consolidated-output data/operations/mtg_marketplace/consolidated_marketplace_prices.csv \
            --decisions-output data/operations/mtg_marketplace/certified_marketplace_decisions.csv \
            --summary-output data/operations/mtg_marketplace/marketplace_decision_summary.json

      - name: Validate certified marketplace decisions
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          summary_path = Path("data/operations/mtg_marketplace/marketplace_decision_summary.json")
          decisions_path = Path("data/operations/mtg_marketplace/certified_marketplace_decisions.csv")
          prices_path = Path("data/operations/mtg_marketplace/consolidated_marketplace_prices.csv")
          for path in (summary_path, decisions_path, prices_path):
              if not path.is_file():
                  raise SystemExit(f"Required decision artifact missing: {path}")
          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          if payload.get("status") != "PASS" or payload.get("decision_count", 0) < 1:
              raise SystemExit(f"Certified marketplace decisioning failed: {payload}")
          certified = int(payload.get("certified_products", 0) or 0)
          decisions = int(payload.get("decision_count", 0) or 0)
          unmatched = list(payload.get("unmatched_certified_product_ids") or [])
          missing_forecasts = list(payload.get("missing_forecast_product_ids") or [])
          accounted = decisions + len(unmatched) + len(missing_forecasts)
          if decisions < 1:
              raise SystemExit("No model-backed marketplace decisions were produced")
          if accounted != certified:
              raise SystemExit(
                  "Certified marketplace coverage is not fully accounted for: "
                  f"certified={certified}; decisions={decisions}; "
                  f"unmatched={len(unmatched)}; missing_forecasts={len(missing_forecasts)}"
              )
          print(
              "Marketplace model coverage: "
              f"certified={certified}; model_backed={decisions}; "
              f"price_only={len(unmatched)}; missing_forecasts={len(missing_forecasts)}"
          )
          with decisions_path.open("r", encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          if not rows or any(not row.get("signal") for row in rows):
              raise SystemExit("Certified marketplace decision file is empty or missing signals")
          print(f"Certified marketplace decisioning validated: {len(rows)} decisions")
          PY

      - name: Build hosted MTG UIP delivery
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python scripts/build_mtg_hosted_uip_delivery.py \
            --output-root data/operations/mtg_uip_delivery

      - name: Audit live-overlay join contract
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python scripts/audit_phase_11e_live_overlay_contract.py             --package data/operations/mtg_uip_delivery/latest             --market-root data/operations/mtg_marketplace             --output data/operations/mtg_marketplace/phase_11e_overlay_contract_audit.json

      - name: Apply certified live marketplace overlay
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python scripts/apply_mtg_live_uip_overlay.py \
            --package data/operations/mtg_uip_delivery/latest \
            --market-root data/operations/mtg_marketplace

      - name: Validate hosted MTG UIP delivery
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python -m pytest \
            tests/test_mtg_hosted_uip_delivery.py \
            tests/test_mtg_live_uip_overlay.py \
            -q
          test -f data/operations/mtg_uip_delivery/latest/package_summary.json
          test -f data/operations/mtg_uip_delivery/latest/portfolio_positions.csv
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("data/operations/mtg_uip_delivery/latest/package_summary.json")
              .read_text(encoding="utf-8")
          )
          overlay = payload.get("live_overlay", {})
          if overlay.get("status") != "PASS":
              raise SystemExit(f"MTG live overlay was not certified: {overlay}")
          live_prices = int(
              overlay.get("products_with_live_prices", 0) or 0
          )
          live_decisions = int(
              overlay.get("products_with_live_decisions", 0) or 0
          )
          fallback_products = int(
              overlay.get(
                  "products_using_baseline_fallback", 0
              ) or 0
          )

          print(
              "MTG live overlay payload: "
              f"{json.dumps(overlay, sort_keys=True)}"
          )

          if max(live_prices, live_decisions) < 1:
              raise SystemExit(
                  "MTG live overlay contains neither "
                  "live prices nor live decisions"
              )

          print(
              "MTG live overlay validated: "
              f"prices={live_prices}; "
              f"decisions={live_decisions}; "
              f"fallbacks={fallback_products}"
          )
          PY

      - name: Publish source-refresh handoff metadata
        if: ${{ env.LIVE_EXECUTION == 'true' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          output = Path(
              "data/operations/mtg_marketplace/uip_source_refresh_handoff.json"
          )
          payload = {
              "status": "PASS",
              "domain": "mtg",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "capital_policy": "UIP_RECOMMENDED",
              "cash_reserve_policy": "UIP_RECOMMENDED",
              "source_purchase_plan_generated": False,
              "source_purchase_plan_reason": (
                  "Purchase planning occurs after UIP cross-domain allocation."
              ),
              "ebay_collection_scope": {
                  "mode": "BROAD_MAXIMUM_CURRENT_CLIENT",
                  "maximum_unique_listings_per_product": 200,
              },
              "delivery_path": "data/operations/mtg_uip_delivery/latest",
          }
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-marketplace-production-${{ github.run_id }}
          path: |
            data/operations/
            data/validation/phase_10/ebay_matching/
            data/operations/mtg_uip_delivery/
          if-no-files-found: warn
          retention-days: 30
