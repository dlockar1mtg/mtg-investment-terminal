name: MTG Secret Lair Price History

# Keeps Secret Lair TCGplayer prices current. Daily (after TCGCSV's ~20:00 UTC update) it
# reads TCGCSV's live Secret Lair group price files once, refreshes the latest-prices file
# and adds a weekly point to the history, committing only those two data files to main.
# Archive mode backfills from TCGCSV daily archives if they become available again.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: live (today's prices), archive (backfill weekly from TCGCSV archives) or score (re-score stored prices, no fetch)
        required: false
        default: live
        type: choice
        options: [live, archive, score]
      start:
        description: Archive mode only - first date to consider (YYYY-MM-DD)
        required: false
        default: "2024-02-08"
        type: string
      max_snapshots:
        description: Archive mode only - stop after this many new weeks (0 = all)
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 0 * * *" # backup: skipped unless the last run that did the work is over 20 hours old (see the gate job)
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mtg-secret-lair-price-history
  cancel-in-progress: false

jobs:
  gate:
    # GitHub often starts scheduled runs hours late or skips them, so this workflow also has
    # backup schedule times. A scheduled run goes ahead only if no run of this workflow finished
    # its work successfully in the last 20 hours: TCGCSV asks for at most one request per price
    # file per 24 hours, and the backups span 9 hours, so 20 hours keeps a late backup from
    # fetching again at the next day's first slot. Manual and other runs always go ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          ALWAYS_RUN_SCHEDULES: ""
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ -n "$ALWAYS_RUN_SCHEDULES" ] && [[ "|$ALWAYS_RUN_SCHEDULES|" == *"|$SCHEDULE|"* ]]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf##*/}"
          since="$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_branch == \"main\" and .conclusion == \"success\") | select(.id != $GITHUB_RUN_ID) | select(.event == \"schedule\" or .event == \"workflow_dispatch\") | select(.run_started_at >= \"$since\") | .id")"
          for id in $ids; do
            worked="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
            if [ "$worked" -gt 0 ]; then
              echo "Run $id already did this workflow's work since $since, so this backup run stops here."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  history:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }} # a failed gate never blocks the run
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HISTORY_MODE: ${{ inputs.mode || 'live' }}
      HISTORY_START: ${{ inputs.start || '2024-02-08' }}
      HISTORY_MAX: ${{ inputs.max_snapshots || '0' }}
      HISTORY_FILE: data/history/tcgcsv_weekly/secret_lair_weekly_prices.csv
      LATEST_FILE: data/history/tcgcsv_weekly/secret_lair_latest_prices.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch Secret Lair prices from TCGCSV
        if: env.HISTORY_MODE != 'score'
        run: |
          set -euo pipefail
          if [ "$HISTORY_MODE" = "archive" ]; then
            python scripts/backfill_secret_lair_tcgcsv_history.py --start "$HISTORY_START" --max-snapshots "$HISTORY_MAX"
          else
            python scripts/backfill_secret_lair_tcgcsv_history.py --live
          fi
      - name: Fetch Collector box prices
        if: env.HISTORY_MODE == 'live'
        continue-on-error: true   # a box-feed outage must not block the Secret Lair prices
        run: python scripts/collect_box_tcgcsv_prices.py --segment collector
      - name: Fetch Pre-Collector box prices
        if: env.HISTORY_MODE == 'live'
        continue-on-error: true   # never blocks the Secret Lair prices
        run: |
          python scripts/build_precollector_box_list.py
          python scripts/collect_box_tcgcsv_prices.py --boxes data/product_master/precollector_model_input.csv --segment precollector
      - name: Score Pre-Collector v2 decisions
        if: (env.HISTORY_MODE == 'live' || env.HISTORY_MODE == 'score') && hashFiles('data/history/mtg_ledger/universal_mtg_daily_consolidated_ledger.csv') != ''
        continue-on-error: true   # never blocks the Secret Lair prices
        run: |
          [ -f data/product_master/precollector_model_input.csv ] || python scripts/build_precollector_box_list.py
          python scripts/build_precollector_v2_decisions.py
      - name: Score Collector v2 decisions
        if: (env.HISTORY_MODE == 'live' || env.HISTORY_MODE == 'score') && hashFiles('data/history/mtg_ledger/universal_mtg_daily_consolidated_ledger.csv') != ''
        continue-on-error: true   # never blocks the Secret Lair prices
        run: python scripts/build_collector_v2_decisions.py
      - name: Score Secret Lair v2 decisions
        if: env.HISTORY_MODE == 'live' || env.HISTORY_MODE == 'score'
        run: python scripts/build_secret_lair_v2_decisions.py
      - name: Summarize
        run: |
          python - <<'PY'
          import csv, os
          from collections import defaultdict
          def rows(path):
              return list(csv.DictReader(open(path, encoding="utf-8"))) if os.path.exists(path) else []
          history, latest = rows(os.environ["HISTORY_FILE"]), rows(os.environ["LATEST_FILE"])
          weeks = sorted({r["snapshot_date"] for r in history})
          priced = defaultdict(set)
          for r in history:
              if r["market_price"]:
                  priced[r["snapshot_date"]].add(r["secret_lair_id"])
          latest_priced = {r["secret_lair_id"] for r in latest if r["market_price"]}
          stamp = latest[0]["snapshot_date"] if latest else "none"
          lines = ["# Secret Lair prices", "", f"Latest snapshot: {stamp}; products with a market price: {len(latest_priced)}", f"Weekly history: {len(weeks)} weeks, {len(history)} rows", "", "| Week | Products priced |", "|---|---|"]
          lines += [f"| {w} | {len(priced[w])} |" for w in weeks[-8:]]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Propose and merge the updated price files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main requires a pull request, so each update goes through one and is merged at once.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "$HISTORY_FILE" "$LATEST_FILE" data/history/tcgcsv_weekly/secret_lair_v2_decisions.csv data/history/tcgcsv_weekly/secret_lair_v2_decisions.json data/history/tcgcsv_weekly/secret_lair_v2_history.json data/history/boxes/precollector_latest_prices.csv data/history/boxes/precollector_weekly_prices.csv data/history/boxes/precollector_v2_decisions.csv data/history/boxes/precollector_v2_decisions.json data/history/boxes/precollector_v2_history.json data/history/boxes/collector_latest_prices.csv data/history/boxes/collector_weekly_prices.csv data/history/boxes/collector_v2_decisions.csv data/history/boxes/collector_v2_decisions.json data/history/boxes/collector_v2_history.json; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --cached --quiet; then echo "No price changes."; exit 0; fi
          stamp="$(tail -n 1 "$LATEST_FILE" 2>/dev/null | cut -d, -f1 || true)"
          branch="data/secret-lair-prices-${stamp:-update}-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git commit -m "Secret Lair TCGplayer prices ${stamp:-update} (${HISTORY_MODE})"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Secret Lair prices ${stamp:-update}" --body "Automated TCGCSV price update from the MTG Secret Lair Price History workflow (run $GITHUB_RUN_ID, mode ${HISTORY_MODE}). Touches only the data files listed in this workflow: Secret Lair, Collector and Pre-Collector latest/weekly prices and their v2 decision files (CSV, JSON summary, price history) under data/history/."
          gh pr merge "$branch" --merge --delete-branch
