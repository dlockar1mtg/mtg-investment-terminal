name: MTG Secret Lair Price History

# Builds (backfill) and extends the weekly Secret Lair TCGplayer price history from
# TCGCSV daily archives, then proposes the updated history file as a pull request.
on:
  workflow_dispatch:
    inputs:
      start:
        description: First date to consider (YYYY-MM-DD); weeks already stored are skipped
        required: false
        default: "2024-02-08"
        type: string
      max_snapshots:
        description: Stop after this many new weeks (0 = all)
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "40 13 * * 2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mtg-secret-lair-price-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      HISTORY_START: ${{ inputs.start || '2024-02-08' }}
      HISTORY_MAX: ${{ inputs.max_snapshots || '0' }}
      HISTORY_FILE: data/history/tcgcsv_weekly/secret_lair_weekly_prices.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch weekly Secret Lair prices from TCGCSV archives
        run: python scripts/backfill_secret_lair_tcgcsv_history.py --start "$HISTORY_START" --max-snapshots "$HISTORY_MAX"
      - name: Summarize the history
        run: |
          python - <<'PY'
          import csv, os
          from collections import defaultdict
          path = os.environ["HISTORY_FILE"]
          rows = list(csv.DictReader(open(path, encoding="utf-8"))) if os.path.exists(path) else []
          weeks = sorted({r["snapshot_date"] for r in rows})
          priced = defaultdict(set)
          for r in rows:
              if r["market_price"]:
                  priced[r["snapshot_date"]].add(r["secret_lair_id"])
          lines = ["# Secret Lair weekly price history", "", f"Rows: {len(rows)}; weeks: {len(weeks)}" + (f" ({weeks[0]} to {weeks[-1]})" if weeks else ""), "", "| Week | Products with a market price |", "|---|---|"]
          lines += [f"| {w} | {len(priced[w])} |" for w in weeks[-12:]]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Propose the updated history as a pull request
        run: |
          set -euo pipefail
          if git diff --quiet -- "$HISTORY_FILE" && [ -z "$(git ls-files --others --exclude-standard -- "$HISTORY_FILE")" ] && git ls-files --error-unmatch "$HISTORY_FILE" >/dev/null 2>&1; then echo "No new weeks."; exit 0; fi
          branch="history/secret-lair-tcgcsv-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -f "$HISTORY_FILE"
          last="$(tail -n 1 "$HISTORY_FILE" | cut -d, -f1)"
          git commit -m "Secret Lair weekly price history through $last"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Secret Lair weekly price history through $last" --body "Weekly TCGplayer market prices for the Secret Lair products in the approved map (docs/phase_8/secret_lair/secret_lair_v1_tcg_current_price_status.csv), from TCGCSV daily archives, one Monday per week. Added by the MTG Secret Lair Price History workflow (run $GITHUB_RUN_ID). Close and reopen to run CI."
