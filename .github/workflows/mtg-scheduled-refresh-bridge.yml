name: MTG Scheduled Refresh Bridge

# No longer scheduled. MTG Marketplace Production has its own schedule (12:15 UTC plus gated
# backups); this bridge also dispatched it daily at 12:27, so production ran twice on 2026-10-06,
# 10-07 and 10-08 (double eBay calls). Kept for manual use only; a dispatch from here is now
# gated by production's gate job like a scheduled run.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mtg-scheduled-refresh-bridge
  cancel-in-progress: false

jobs:
  dispatch-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch MTG marketplace production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/mtg-marketplace-production.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"live_execution":"true"}}'
          echo "MTG marketplace production dispatch accepted."
