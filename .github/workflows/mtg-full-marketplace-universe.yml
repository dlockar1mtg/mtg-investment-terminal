name: MTG Full Marketplace Universe

on:
  workflow_dispatch:
    inputs:
      live_execution:
        description: "Run live eBay and TCGCSV collection"
        required: true
        default: false
        type: boolean
      batch_size:
        description: "Products per batch"
        required: true
        default: "50"
        type: string
      start_batch:
        description: "Zero-based batch index to start or resume from"
        required: true
        default: "0"
        type: string
      max_batches:
        description: "Maximum batches this run; 0 means all remaining"
        required: true
        default: "10"
        type: string
      ebay_limit:
        description: "Maximum eBay listings requested per product"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: mtg-full-marketplace-universe
  cancel-in-progress: false

jobs:
  full-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIVE_EXECUTION: ${{ inputs.live_execution }}
      MTG_LIVE_EXECUTION: ${{ inputs.live_execution }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      START_BATCH: ${{ inputs.start_batch }}
      MAX_BATCHES: ${{ inputs.max_batches }}
      EBAY_LIMIT: ${{ inputs.ebay_limit }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - name: Checkout MTG repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9"
          python -m pip check

      - name: Validate live credentials
        if: ${{ inputs.live_execution == true }}
        run: |
          test -n "$EBAY_CLIENT_ID" || { echo "EBAY_CLIENT_ID secret is missing"; exit 1; }
          test -n "$EBAY_CLIENT_SECRET" || { echo "EBAY_CLIENT_SECRET secret is missing"; exit 1; }

      - name: Run full-universe certification tests
        run: |
          python -m pytest \
            tests/test_full_marketplace_universe.py \
            tests/test_mtg_marketplace_production.py \
            tests/test_daily_ebay_collection_entrypoint.py \
            tests/test_daily_tcgcsv_collection_entrypoint.py \
            -q

      - name: Build governed sealed product map
        run: |
          python scripts/build_full_marketplace_product_map.py \
            --investment-products data/product_master/investment_products.csv \
            --secret-lair-master data/validation/phase_10/premium_universe_eligibility/secret_lair_master_registry_ready_universe.csv \
            --secret-lair-review data/validation/phase_10/premium_universe_eligibility/secret_lair_master_review_required_universe.csv \
            --output data/operations/mtg_full_marketplace/full_product_map.csv \
            --summary-output data/operations/mtg_full_marketplace/full_product_map_summary.json

      - name: Certify governed universe counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/operations/mtg_full_marketplace/full_product_map_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          # These certify approved production records, not raw type totals.
          # The source registry has 348 booster-display-class rows, but only
          # 234 satisfy approval_status=approved and enter live collection.
          expected = {
              "booster_display_count": 234,
              "secret_lair_count": 993,
              "total_marketplace_products": 1227,
              "ebay_ready_count": 1227,
              "tcgcsv_ready_count": 1216,
              "ebay_only_count": 11,
              "review_excluded_count": 15,
          }
          errors = [
              f"{key}: expected {value}, got {payload.get(key)}"
              for key, value in expected.items()
              if payload.get(key) != value
          ]
          if errors:
              raise SystemExit("Governed universe count mismatch:\n" + "\n".join(errors))
          print(json.dumps(payload, indent=2))
          PY

      - name: Run resumable full-universe batches
        shell: bash
        run: |
          LIVE_FLAG=""
          if [[ "$LIVE_EXECUTION" == "true" ]]; then
            LIVE_FLAG="--live"
          fi
          python scripts/run_full_marketplace_universe.py \
            $LIVE_FLAG \
            --product-map data/operations/mtg_full_marketplace/full_product_map.csv \
            --model-input data/product_master/product_master_model_input.csv \
            --output-root data/operations/mtg_full_marketplace \
            --batch-size "$BATCH_SIZE" \
            --start-batch "$START_BATCH" \
            --max-batches "$MAX_BATCHES" \
            --ebay-limit "$EBAY_LIMIT"

      - name: Summarize coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("full_product_map_summary.json", "latest.json", "checkpoint.json"):
              path = Path("data/operations/mtg_full_marketplace") / name
              if path.is_file():
                  print(f"\n=== {name} ===")
                  print(json.dumps(json.loads(path.read_text(encoding="utf-8")), indent=2))
          PY

      - name: Upload full-universe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-full-marketplace-universe-${{ github.run_id }}
          path: |
            data/operations/mtg_full_marketplace/
            data/validation/phase_10/ebay_matching/
          if-no-files-found: error
          retention-days: 30
